<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images With Proper Alt Attributes</title>
</head>
<body>
    <header>
        <h1>Accessible Company Website</h1>
        <!-- Good: img tag with descriptive alt attribute -->
        <img src="logo.png" alt="Company Name Logo" width="200" height="100">
    </header>
    
    <main>
        <section class="hero">
            <h2>Welcome to Our Service</h2>
            <!-- Good: descriptive alt text for hero image -->
            <img src="hero-banner.jpg" alt="Team of professionals collaborating in modern office" class="hero-image">
        </section>
        
        <section class="products">
            <h2>Our Products</h2>
            <div class="product-grid">
                <div class="product">
                    <h3>Product 1</h3>
                    <!-- Good: product image with descriptive alt -->
                    <img src="product1.jpg" alt="Wireless headphones with noise cancellation" width="300" height="200">
                    <p>Amazing product description</p>
                </div>
                
                <div class="product">
                    <h3>Product 2</h3>
                    <!-- Good: another product image with proper alt -->
                    <img src="product2.jpg" alt="Smartphone with advanced camera features" class="product-image">
                    <p>Another great product</p>
                </div>
            </div>
        </section>
        
        <section class="team">
            <h2>Meet Our Team</h2>
            <!-- Good: team member photo with descriptive alt -->
            <img src="team/john.jpg" alt="John Smith, CEO - headshot of professional man in business suit" class="team-photo">
            <p>John Smith, CEO</p>
            
            <!-- Good: another team member photo with proper alt -->
            <img src="team/jane.jpg" alt="Jane Doe, CTO - professional woman with technology background" class="team-photo" width="150" height="150">
            <p>Jane Doe, CTO</p>
        </section>
        
        <section class="values">
            <h2>Our Values</h2>
            <p>We believe in excellence and innovation.</p>
            <!-- Good: meaningful image with descriptive alt -->
            <img src="values-graphic.svg" alt="Innovation and excellence represented by interconnected gears">
        </section>
    </main>
    
    <footer>
        <p>&copy; 2024 Company Name</p>
        <!-- Good: footer logo with appropriate alt -->
        <img src="footer-logo.png" alt="Company Name - Return to homepage">
    </footer>
</body>
</html>
